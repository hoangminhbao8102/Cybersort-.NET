<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!--
        btn: button
        btn-màu => button màu
        btn-outline-màu: viền có màu bên trong không có màu

        input
            + label -> form-label (for đến id của input)
            + input -> form-control (đối với input-text) form-select -> the select option
            + text -> form-text chữ dưới input
    -->
    <div class="container">
        <h3>HTML Form</h3>
        <form>
            <div class="form-group my-2">
                <label class="form-label" for="tai-khoan">Tài khoản</label>
                <input class="form-control form-control-sm" id="tai-khoan" name="taiKhoan" placeholder="Nhập vào tài khoản của bạn">
                <p class="form-text">Ví dụ: nguyenvana2110</p>
            </div>
            <div class="form-group my-2">
                <label class="form-label" for="mat-khau">Mật khẩu</label>
                <input type="password" class="form-control" id="mat-khau" name="matKhau" placeholder="Nhập vào mật khẩu">
                <p class="form-text">Ví dụ: nguyenvana2110</p>
            </div>
            <div class="form-group my-2">
                <label class="form-label" for="email">Mật khẩu</label>
                <input type="email" class="form-control" id="email" name="email" value="nguyenvana@gmail.com" disabled>
                <p class="form-text">Ví dụ: nguyenvana2110</p>
            </div>
            <div class="form-group my-2">
                <label class="form-label" for="quocTich">Quốc tịch</label>
                <select class="form-select">
                    <option value="vn">Việt Nam</option>
                    <option value="us">Hoa Kỳ</option>
                    <option value="cn">Trung Quốc</option>
                </select>
            </div>
            <div class="form-group d-flex gap-2">
                <label class="form-label">Giới tính</label>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="gioiTinh" value="False" id="nam">
                    <label class="form-check-label" for="nam">Nam</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="gioiTinh" value="False" id="nu">
                    <label class="form-check-label" for="nu">Nữ</label>
                </div>
            </div>
                        <div class="form-group d-flex gap-2">
                <label class="form-label">Sở thích</label>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="soThich" value="bongDa" id="bongDa">
                    <label class="form-check-label" for="bongDa">Bóng đá</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="soThich" value="lapTrinh" id="lapTrinh">
                    <label class="form-check-label" for="lapTrinh">Lập trình</label>
                </div>
            </div>
            <button class="btn btn-success" type="submit">Submit</button>
            <button class="btn btn-outline-primary" type="reset">Reset</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
